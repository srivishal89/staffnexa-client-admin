<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staffnexa – Candidate Applications</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>

<body class="bg-slate-50 text-slate-800 h-screen flex overflow-hidden">

<main class="flex-1 flex flex-col h-full">

<header class="bg-white border-b h-16 flex items-center px-6">
    <h1 class="text-xl font-semibold">Candidate Applications</h1>
</header>

<div class="flex-1 p-6 overflow-auto">

<div class="bg-white rounded-xl shadow p-6">

<table class="w-full border">
<thead class="bg-gray-100">
<tr>
<th class="p-3">Name</th>
<th class="p-3">Phone</th>
<th class="p-3">Role</th>
<th class="p-3">Location</th>
<th class="p-3">Date</th>
<th class="p-3">Action</th>
</tr>
</thead>

<tbody id="tableBody">
<tr>
<td colspan="6" class="text-center p-6">Loading...</td>
</tr>
</tbody>

</table>

</div>

</div>

</main>

<script>
const API_BASE = "https://staffnexa-backend.onrender.com";

function getToken() {
    const token = localStorage.getItem("adminAuth");
    if (!token) {
        window.location.href = "index.html";
        return null;
    }
    return token;
}

async function loadData() {
    const token = getToken();
    if (!token) return;

    try {
        const res = await fetch(API_BASE + "/candidates", {
            headers: {
                "Authorization": "Basic " + token
            }
        });

        const data = await res.json();

        console.log("API DATA:", data);

        let list = [];

        if (Array.isArray(data)) {
            list = data;
        } else if (data.data) {
            list = data.data;
        }

        render(list);

    } catch (e) {
        console.error(e);
        document.getElementById("tableBody").innerHTML =
            "<tr><td colspan='6' class='text-red-500 text-center p-6'>Error loading data</td></tr>";
    }
}

function render(list) {
    const table = document.getElementById("tableBody");

    if (!list.length) {
        table.innerHTML = "<tr><td colspan='6' class='text-center p-6'>No data</td></tr>";
        return;
    }

    table.innerHTML = "";

    list.forEach(c => {
        table.innerHTML += `
            <tr class="border-b">
                <td class="p-3">${c.name || ""}</td>
                <td class="p-3">${c.phone || ""}</td>
                <td class="p-3">${c.jobRole || ""}</td>
                <td class="p-3">${c.location || ""}</td>
                <td class="p-3">${new Date(c.createdAt).toLocaleString()}</td>
                <td class="p-3">
                    <button onclick="deleteItem('${c._id}')" class="text-red-600">Delete</button>
                </td>
            </tr>
        `;
    });
}

async function deleteItem(id) {
    if (!confirm("Delete?")) return;

    const token = getToken();

    await fetch(API_BASE + "/candidates/" + id, {
        method: "DELETE",
        headers: {
            "Authorization": "Basic " + token
        }
    });

    loadData();
}

loadData();
</script>

</body>
</html>
