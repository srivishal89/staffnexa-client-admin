<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staffnexa Admin — Client Enquiries</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
body { font-family: 'Inter', sans-serif; background-color: #f9fafb; }
</style>
</head>

<body class="min-h-screen">

<nav class="bg-blue-700 text-white px-6 py-4 flex justify-between items-center shadow-md">
    <h1 class="text-xl font-bold">Staffnexa Admin</h1>
    <button onclick="logout()" class="bg-blue-500 px-4 py-1 rounded">Logout</button>
</nav>

<main class="max-w-7xl mx-auto px-4 py-8">

<div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold">Client Enquiries</h2>

    <button onclick="exportCSV()" class="bg-white border px-4 py-2 rounded shadow">
        Export CSV
    </button>
</div>

<!-- FILTER -->
<div class="bg-white p-4 rounded-xl border mb-6 flex gap-4">

    <input id="companySearch" onkeyup="filterTable()"
        placeholder="Search..."
        class="border p-2 rounded w-full"/>

    <select id="roleFilter" onchange="filterTable()" class="border p-2 rounded">
        <option value="">All Roles</option>
        <option>Pantry</option>
        <option>Housekeeping</option>
        <option>Security</option>
    </select>

</div>

<!-- TABLE -->
<div class="bg-white rounded-xl border overflow-hidden">

<div class="overflow-x-auto">
<table class="min-w-full">

<thead class="bg-gray-50 text-gray-500 text-sm">
<tr>
<th class="px-6 py-3 text-left">Company</th>
<th class="px-6 py-3 text-left">Contact</th>
<th class="px-6 py-3 text-left">Requirement</th>
<th class="px-6 py-3 text-left">Timeline</th>
<th class="px-6 py-3 text-left">Status</th>
<th class="px-6 py-3 text-right">Action</th>
</tr>
</thead>

<tbody id="tableBody" class="divide-y"></tbody>

</table>
</div>

</div>

</main>

<script>

const API_BASE = "https://staffnexa-backend.onrender.com";
let enquiriesData = [];

// =======================
// LOAD DATA
// =======================
async function loadEnquiries() {
    try {
        const res = await fetch(`${API_BASE}/client-enquiries`, {
            cache: "no-store"
        });

        const data = await res.json();

        enquiriesData = Array.isArray(data) ? data : [];

        renderTable(enquiriesData);

    } catch (err) {
        console.error(err);
        alert("Failed to load data");
    }
}

// =======================
// RENDER TABLE (NO UI CHANGE)
// =======================
function renderTable(data) {

    const tableBody = document.getElementById("tableBody");
    tableBody.innerHTML = "";

    if (!data.length) {
        tableBody.innerHTML = `
            <tr>
                <td colspan="6" class="px-6 py-4 text-center text-gray-500">
                    No enquiries found
                </td>
            </tr>
        `;
        return;
    }

    data.forEach(item => {

        const initials = (item.companyName || "NA")
            .split(" ")
            .map(w => w[0])
            .join("")
            .substring(0,2)
            .toUpperCase();

        tableBody.innerHTML += `
        <tr class="hover:bg-gray-50">

            <td class="px-6 py-4">
                <div class="flex items-center">
                    <div class="h-8 w-8 rounded bg-blue-100 flex items-center justify-center text-blue-700 text-xs font-bold">
                        ${initials}
                    </div>
                    <div class="ml-3">
                        <div class="font-semibold">${item.companyName}</div>
                        <div class="text-xs text-gray-500">${item.location}</div>
                    </div>
                </div>
            </td>

            <td class="px-6 py-4">
                <div>${item.contactPerson}</div>
                <div class="text-sm text-gray-500">${item.phone}</div>
            </td>

            <td class="px-6 py-4">
                <span class="bg-indigo-100 text-indigo-700 px-2 py-1 rounded text-xs">
                    ${item.requirementType}
                </span>
                <div class="text-xs mt-1">Staff: ${item.numberOfStaff}</div>
            </td>

            <td class="px-6 py-4">
                <span class="bg-yellow-100 text-yellow-700 px-2 py-1 rounded text-xs">
                    ${item.timeline}
                </span>
            </td>

            <td class="px-6 py-4">
                <select onchange="updateStatus('${item._id}', this.value)"
                    class="border p-1 rounded">
                    
                    <option ${item.status === "New" ? "selected" : ""}>New</option>
                    <option ${item.status === "Contacted" ? "selected" : ""}>Contacted</option>
                    <option ${item.status === "In Progress" ? "selected" : ""}>In Progress</option>
                    <option ${item.status === "Closed" ? "selected" : ""}>Closed</option>
                </select>
            </td>

            <td class="px-6 py-4 text-right">
                <button onclick="deleteRow('${item._id}')" class="text-red-600">
                    Delete
                </button>
            </td>

        </tr>
        `;
    });
}

// =======================
// FILTER
// =======================
function filterTable() {

    const search = document.getElementById("companySearch").value.toLowerCase();
    const role = document.getElementById("roleFilter").value.toLowerCase();

    const filtered = enquiriesData.filter(item => {

        const company = (item.companyName || "").toLowerCase();
        const contact = (item.contactPerson || "").toLowerCase();
        const r = (item.requirementType || "").toLowerCase();

        return (company.includes(search) || contact.includes(search)) &&
               (role === "" || r.includes(role));
    });

    renderTable(filtered);
}

// =======================
// DELETE
// =======================
async function deleteRow(id) {

    if (!confirm("Delete this enquiry?")) return;

    await fetch(`${API_BASE}/client-enquiries/${id}`, {
        method: "DELETE"
    });

    loadEnquiries();
}

// =======================
// UPDATE STATUS
// =======================
async function updateStatus(id, status) {

    await fetch(`${API_BASE}/client-enquiries/${id}/status`, {
        method: "PUT",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ status })
    });
}

// =======================
// EXPORT CSV
// =======================
function exportCSV() {

    let csv = "Company,Contact,Phone,Role,Staff,Location,Timeline,Status\n";

    enquiriesData.forEach(item => {
        csv += `${item.companyName},${item.contactPerson},${item.phone},${item.requirementType},${item.numberOfStaff},${item.location},${item.timeline},${item.status}\n`;
    });

    const blob = new Blob([csv], { type: "text/csv" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "client-enquiries.csv";
    a.click();
}

// =======================
// LOGOUT
// =======================
function logout() {
    localStorage.removeItem("clientAuth");
    window.location.href = "index.html";
}

// INIT
loadEnquiries();

</script>

</body>
</html>
