<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staffnexa Admin</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
    font-family: 'Inter', sans-serif;
    background-color: #f3f4f6;
}
.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.05);
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white px-6 py-4 flex justify-between items-center">
    <h1 class="text-xl font-semibold">Staffnexa Admin</h1>
    <button onclick="logout()" class="bg-white text-blue-600 px-4 py-1 rounded">Logout</button>
</header>

<!-- MAIN -->
<div class="max-w-7xl mx-auto px-4 py-8">

<h2 class="text-2xl font-bold mb-6">Client Enquiries Dashboard</h2>

<!-- STATS -->
<div class="grid grid-cols-4 gap-4 mb-6">

<div class="card">
    <div class="text-gray-500">Total Leads</div>
    <div id="totalLeads" class="text-2xl font-bold">0</div>
</div>

<div class="card">
    <div class="text-gray-500">New</div>
    <div id="newLeads" class="text-2xl font-bold text-blue-600">0</div>
</div>

<div class="card">
    <div class="text-gray-500">Contacted</div>
    <div id="contactedLeads" class="text-2xl font-bold text-yellow-500">0</div>
</div>

<div class="card">
    <div class="text-gray-500">Closed</div>
    <div id="closedLeads" class="text-2xl font-bold text-green-600">0</div>
</div>

</div>

<!-- FILTER -->
<div class="card mb-6 flex gap-4">

<input id="companySearch" onkeyup="filterTable()" placeholder="Search..."
    class="border p-2 rounded w-full"/>

<select id="roleFilter" onchange="filterTable()" class="border p-2 rounded">
    <option value="">All Roles</option>
    <option>Pantry</option>
    <option>Housekeeping</option>
    <option>Security</option>
</select>

<button onclick="exportCSV()" class="bg-indigo-600 text-white px-4 py-2 rounded">
    Export
</button>

</div>

<!-- TABLE -->
<div class="card">

<table class="min-w-full">

<thead class="bg-gray-100 text-gray-600 text-sm">
<tr>
<th class="px-4 py-3 text-left">Company</th>
<th class="px-4 py-3 text-left">Contact</th>
<th class="px-4 py-3 text-left">Requirement</th>
<th class="px-4 py-3 text-left">Timeline</th>
<th class="px-4 py-3 text-left">Status</th>
<th class="px-4 py-3 text-right">Action</th>
</tr>
</thead>

<tbody id="tableBody" class="divide-y"></tbody>

</table>

</div>

</div>

<script>

const API_BASE = "https://staffnexa-backend.onrender.com";

let enquiriesData = [];

// =======================
// LOAD DATA
// =======================
async function loadEnquiries() {
    const res = await fetch(`${API_BASE}/client-enquiries`, { cache: "no-store" });
    const data = await res.json();

    enquiriesData = Array.isArray(data) ? data : [];

    updateStats(enquiriesData);
    renderTable(enquiriesData);
}

// =======================
// STATS
// =======================
function updateStats(data) {

    document.getElementById("totalLeads").innerText = data.length;

    document.getElementById("newLeads").innerText =
        data.filter(d => d.status === "New").length;

    document.getElementById("contactedLeads").innerText =
        data.filter(d => d.status === "Contacted").length;

    document.getElementById("closedLeads").innerText =
        data.filter(d => d.status === "Closed").length;
}

// =======================
// RENDER TABLE
// =======================
function renderTable(data) {

    const tableBody = document.getElementById("tableBody");
    tableBody.innerHTML = "";

    if (!data.length) {
        tableBody.innerHTML = `<tr><td colspan="6" class="p-4 text-center">No data</td></tr>`;
        return;
    }

    data.forEach(item => {

        tableBody.innerHTML += `
        <tr>

            <td class="px-4 py-3 font-semibold">${item.companyName}</td>

            <td class="px-4 py-3">
                ${item.contactPerson}
                <div class="text-xs text-gray-500">${item.phone}</div>
            </td>

            <td class="px-4 py-3">
                ${item.requirementType} (${item.numberOfStaff})
            </td>

            <td class="px-4 py-3">${item.timeline}</td>

            <td class="px-4 py-3">
                <select onchange="updateStatus('${item._id}', this.value)" class="border rounded p-1">

                    <option ${item.status === "New" ? "selected" : ""}>New</option>
                    <option ${item.status === "Contacted" ? "selected" : ""}>Contacted</option>
                    <option ${item.status === "In Progress" ? "selected" : ""}>In Progress</option>
                    <option ${item.status === "Closed" ? "selected" : ""}>Closed</option>

                </select>
            </td>

            <td class="px-4 py-3 text-right">
                <button onclick="deleteRow('${item._id}')" class="text-red-600">Delete</button>
            </td>

        </tr>
        `;
    });
}

// =======================
// FILTER
// =======================
function filterTable() {

    const search = document.getElementById("companySearch").value.toLowerCase();
    const role = document.getElementById("roleFilter").value.toLowerCase();

    const filtered = enquiriesData.filter(item => {

        return (item.companyName.toLowerCase().includes(search) ||
                item.contactPerson.toLowerCase().includes(search)) &&
               (role === "" || item.requirementType.toLowerCase().includes(role));
    });

    renderTable(filtered);
}

// =======================
// DELETE
// =======================
async function deleteRow(id) {
    if (!confirm("Delete this enquiry?")) return;

    await fetch(`${API_BASE}/client-enquiries/${id}`, { method: "DELETE" });

    loadEnquiries();
}

// =======================
// STATUS UPDATE
// =======================
async function updateStatus(id, status) {
    await fetch(`${API_BASE}/client-enquiries/${id}/status`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status })
    });

    loadEnquiries();
}

// =======================
// EXPORT
// =======================
function exportCSV() {
    let csv = "Company,Contact,Phone,Role,Staff,Location,Timeline,Status\n";

    enquiriesData.forEach(item => {
        csv += `${item.companyName},${item.contactPerson},${item.phone},${item.requirementType},${item.numberOfStaff},${item.location},${item.timeline},${item.status}\n`;
    });

    const blob = new Blob([csv], { type: "text/csv" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "client-enquiries.csv";
    a.click();
}

// =======================
// LOGOUT
// =======================
function logout() {
    localStorage.removeItem("clientAuth");
    window.location.href = "index.html";
}

// INIT
loadEnquiries();

</script>

</body>
</html>
