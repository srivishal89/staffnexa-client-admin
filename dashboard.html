<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staffnexa CRM</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
    font-family: 'Inter', sans-serif;
    background-color: #f3f4f6;
}
.card {
    background: white;
    padding: 16px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
}
</style>
</head>

<body class="flex">

<!-- SIDEBAR -->
<div class="w-56 bg-white border-r h-screen p-4">
    <h2 class="text-lg font-bold mb-6">Staffnexa</h2>

    <ul class="space-y-3 text-gray-600">
        <li class="font-semibold text-blue-600">Dashboard</li>
        <li>Leads</li>
        <li>Candidates</li>
        <li>Settings</li>
    </ul>
</div>

<!-- MAIN -->
<div class="flex-1">

<!-- HEADER -->
<div class="bg-white border-b px-6 py-4 flex justify-between">
    <h1 class="font-semibold">Client Enquiries</h1>
    <button onclick="logout()" class="text-red-500">Logout</button>
</div>

<div class="p-6">

<!-- STATS -->
<div class="grid grid-cols-4 gap-4 mb-6">

<div class="card">
    <div class="text-sm text-gray-500">Total Leads</div>
    <div id="totalLeads" class="text-xl font-bold">0</div>
</div>

<div class="card">
    <div class="text-sm text-gray-500">New</div>
    <div id="newLeads" class="text-xl font-bold text-blue-600">0</div>
</div>

<div class="card">
    <div class="text-sm text-gray-500">Contacted</div>
    <div id="contactedLeads" class="text-xl font-bold text-yellow-500">0</div>
</div>

<div class="card">
    <div class="text-sm text-gray-500">Closed</div>
    <div id="closedLeads" class="text-xl font-bold text-green-600">0</div>
</div>

</div>

<!-- FILTER -->
<div class="card mb-6 flex gap-4">

<input id="companySearch" onkeyup="filterTable()"
    placeholder="Search company..."
    class="border p-2 rounded w-full"/>

<select id="roleFilter" onchange="filterTable()" class="border p-2 rounded">
    <option value="">All Roles</option>
    <option>Pantry</option>
    <option>Housekeeping</option>
    <option>Security</option>
</select>

<button onclick="exportCSV()" class="bg-blue-600 text-white px-4 py-2 rounded">
    Export
</button>

</div>

<!-- TABLE -->
<div class="card overflow-x-auto">

<table class="min-w-full">

<thead class="text-gray-600 text-sm border-b">
<tr>
<th class="py-2 text-left">Company</th>
<th class="py-2 text-left">Contact</th>
<th class="py-2 text-left">Requirement</th>
<th class="py-2 text-left">Timeline</th>
<th class="py-2 text-left">Status</th>
<th class="py-2 text-right">Action</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>

</table>

</div>

</div>
</div>

<script>

const API_BASE = "https://staffnexa-backend.onrender.com";

let enquiriesData = [];

// =======================
// LOAD DATA (NO CACHE)
// =======================
async function loadEnquiries() {
    try {
        const url = `${API_BASE}/client-enquiries?time=${Date.now()}`;

        const res = await fetch(url, {
            method: "GET",
            headers: {
                "Cache-Control": "no-cache"
            }
        });

        const data = await res.json();

        console.log("DATA:", data);

        enquiriesData = Array.isArray(data) ? data : [];

        updateStats(enquiriesData);
        renderTable(enquiriesData);

    } catch (err) {
        console.error(err);
    }
}

// =======================
// STATS
// =======================
function updateStats(data) {

    document.getElementById("totalLeads").innerText = data.length;

    document.getElementById("newLeads").innerText =
        data.filter(d => d.status === "New").length;

    document.getElementById("contactedLeads").innerText =
        data.filter(d => d.status === "Contacted").length;

    document.getElementById("closedLeads").innerText =
        data.filter(d => d.status === "Closed").length;
}

// =======================
// TABLE
// =======================
function renderTable(data) {

    const tableBody = document.getElementById("tableBody");
    tableBody.innerHTML = "";

    if (!data.length) {
        tableBody.innerHTML = `
        <tr>
            <td colspan="6" class="text-center py-4">No data found</td>
        </tr>`;
        return;
    }

    data.forEach(item => {

        tableBody.innerHTML += `
        <tr>

            <td class="py-2 font-semibold">${item.companyName || ""}</td>

            <td class="py-2">
                ${item.contactPerson || ""}
                <div class="text-xs text-gray-500">${item.phone || ""}</div>
            </td>

            <td class="py-2">
                ${item.requirementType || ""} (${item.numberOfStaff || 0})
            </td>

            <td class="py-2">${item.timeline || ""}</td>

            <td class="py-2">
                <select onchange="updateStatus('${item._id}', this.value)" class="border rounded p-1">
                    <option ${item.status==="New"?"selected":""}>New</option>
                    <option ${item.status==="Contacted"?"selected":""}>Contacted</option>
                    <option ${item.status==="In Progress"?"selected":""}>In Progress</option>
                    <option ${item.status==="Closed"?"selected":""}>Closed</option>
                </select>
            </td>

            <td class="py-2 text-right">
                <button onclick="deleteRow('${item._id}')" class="text-red-500">Delete</button>
            </td>

        </tr>`;
    });
}

// =======================
// FILTER
// =======================
function filterTable() {

    const search = document.getElementById("companySearch").value.toLowerCase();
    const role = document.getElementById("roleFilter").value.toLowerCase();

    const filtered = enquiriesData.filter(item => {

        return (item.companyName.toLowerCase().includes(search) ||
                item.contactPerson.toLowerCase().includes(search)) &&
               (role === "" || item.requirementType.toLowerCase().includes(role));
    });

    renderTable(filtered);
}

// =======================
// DELETE
// =======================
async function deleteRow(id) {

    if (!confirm("Delete this enquiry?")) return;

    await fetch(`${API_BASE}/client-enquiries/${id}`, {
        method: "DELETE"
    });

    loadEnquiries();
}

// =======================
// STATUS
// =======================
async function updateStatus(id, status) {

    await fetch(`${API_BASE}/client-enquiries/${id}/status`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status })
    });

    loadEnquiries();
}

// =======================
// EXPORT
// =======================
function exportCSV() {

    let csv = "Company,Contact,Phone,Role,Staff,Location,Timeline,Status\n";

    enquiriesData.forEach(item => {
        csv += `${item.companyName},${item.contactPerson},${item.phone},${item.requirementType},${item.numberOfStaff},${item.location},${item.timeline},${item.status}\n`;
    });

    const blob = new Blob([csv], { type: "text/csv" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "client-enquiries.csv";
    a.click();
}

// =======================
// LOGOUT
// =======================
function logout() {
    localStorage.removeItem("clientAuth");
    window.location.href = "index.html";
}

// =======================
// INIT
// =======================
loadEnquiries();

</script>

</body>
</html>
