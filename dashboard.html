<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Staffnexa Client Admin</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo-section">
      <img src="logo.png" alt="Logo" class="logo">
      <h2>Staffnexa</h2>
    </div>

    <nav>
      <ul>
        <li class="active">Client Enquiries</li>
      </ul>
    </nav>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">

    <div class="top-bar">
      <div class="filters">
        <input type="text" id="searchInput" placeholder="Search company..." />

        <select id="roleFilter">
          <option>All Roles</option>
          <option>Pantry</option>
          <option>Housekeeping</option>
          <option>Supervisor</option>
        </select>

        <select id="timelineFilter">
          <option>All Timelines</option>
          <option>Immediate</option>
          <option>Within 7 days</option>
          <option>Within 30 days</option>
        </select>
      </div>

      <div class="actions">
        <button id="exportBtn" class="btn-primary">Export CSV</button>
        <button id="deleteBtn" class="btn-danger">Delete</button>
        <button id="logoutBtn" class="btn-secondary">Logout</button>
      </div>
    </div>

    <!-- TABLE -->
    <div class="table-container">
      <table id="dataTable">
        <thead>
          <tr>
            <th><input type="checkbox" id="selectAll"></th>
            <th>Company</th>
            <th>Contact</th>
            <th>Phone</th>
            <th>Role</th>
            <th>Staff</th>
            <th>Location</th>
            <th>Timeline</th>
            <th>Quotation</th>
          </tr>
        </thead>
        <tbody>id="tableBody"
        </tbody>
      </table>
    </div>

  </main>

</div>

<script src="script.js"></script>
</body>
</html>
