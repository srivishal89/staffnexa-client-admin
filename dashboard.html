<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staffnexa CRM</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
    font-family: 'Inter', sans-serif;
    background: #eef2ff;
}
.card {
    background: white;
    border-radius: 14px;
    padding: 18px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.05);
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white p-5 flex justify-between">
    <h1 class="text-xl font-bold">Staffnexa CRM</h1>
    <button onclick="logout()" class="bg-white text-blue-600 px-4 py-1 rounded">Logout</button>
</div>

<div class="p-6">

<!-- STATS -->
<div class="grid grid-cols-4 gap-5 mb-6">

<div class="card">
    <div class="text-gray-500 text-sm">Total Leads</div>
    <div id="totalLeads" class="text-3xl font-bold text-blue-600">0</div>
</div>

<div class="card">
    <div class="text-gray-500 text-sm">New</div>
    <div id="newLeads" class="text-3xl font-bold text-blue-500">0</div>
</div>

<div class="card">
    <div class="text-gray-500 text-sm">Contacted</div>
    <div id="contactedLeads" class="text-3xl font-bold text-yellow-500">0</div>
</div>

<div class="card">
    <div class="text-gray-500 text-sm">Closed</div>
    <div id="closedLeads" class="text-3xl font-bold text-green-600">0</div>
</div>

</div>

<!-- SEARCH -->
<div class="card mb-6">
    <input id="companySearch" onkeyup="filterTable()"
        placeholder="Search company or contact..."
        class="w-full p-3 border rounded focus:ring-2 focus:ring-blue-400">
</div>

<!-- LEADS GRID -->
<div id="leadContainer" class="grid grid-cols-3 gap-5"></div>

</div>

<script>

const API_BASE = "https://staffnexa-backend.onrender.com";
let enquiriesData = [];

// =======================
// LOAD DATA
// =======================
async function loadEnquiries() {
    try {
        const res = await fetch(`${API_BASE}/client-enquiries?time=${Date.now()}`);
        const data = await res.json();

        enquiriesData = Array.isArray(data) ? data : [];

        updateStats(enquiriesData);
        renderCards(enquiriesData);

    } catch (err) {
        console.error(err);
    }
}

// =======================
// STATS
// =======================
function updateStats(data) {

    document.getElementById("totalLeads").innerText = data.length;

    document.getElementById("newLeads").innerText =
        data.filter(d => d.status === "New").length;

    document.getElementById("contactedLeads").innerText =
        data.filter(d => d.status === "Contacted").length;

    document.getElementById("closedLeads").innerText =
        data.filter(d => d.status === "Closed").length;
}

// =======================
// COLORS
// =======================
function statusColor(status) {
    if (status === "New") return "bg-blue-100 text-blue-700";
    if (status === "Contacted") return "bg-yellow-100 text-yellow-700";
    if (status === "Closed") return "bg-green-100 text-green-700";
    return "bg-gray-100";
}

function priorityColor(priority) {
    if (priority === "Hot") return "bg-red-100 text-red-600";
    if (priority === "Warm") return "bg-yellow-100 text-yellow-700";
    return "bg-gray-100";
}

// =======================
// CARDS UI
// =======================
function renderCards(data) {

    const container = document.getElementById("leadContainer");
    container.innerHTML = "";

    if (!data.length) {
        container.innerHTML = "<p>No data found</p>";
        return;
    }

    data.forEach(item => {

        container.innerHTML += `
        <div class="card">

            <div class="flex justify-between items-center mb-2">
                <h3 class="font-semibold text-lg">${item.companyName}</h3>
                <span class="px-2 py-1 rounded text-xs ${priorityColor(item.priority)}">
                    ${item.priority || "Warm"}
                </span>
            </div>

            <div class="text-sm text-gray-600 mb-2">
                ${item.contactPerson} • ${item.phone}
            </div>

            <div class="text-sm mb-2">
                ${item.requirementType} (${item.numberOfStaff})
            </div>

            <div class="text-sm mb-3 text-gray-500">
                ${item.location || ""}
            </div>

            <div class="flex justify-between items-center mb-3">
                <span class="px-2 py-1 rounded text-xs ${statusColor(item.status)}">
                    ${item.status}
                </span>

                <input type="date"
                    value="${item.followUpDate ? item.followUpDate.split('T')[0] : ''}"
                    onchange="updateFollowUp('${item._id}', this.value)"
                    class="border p-1 rounded text-xs"/>
            </div>

            <div class="flex gap-2">

                <select onchange="updateStatus('${item._id}', this.value)"
                    class="border p-1 rounded text-xs w-full">
                    <option ${item.status==="New"?"selected":""}>New</option>
                    <option ${item.status==="Contacted"?"selected":""}>Contacted</option>
                    <option ${item.status==="In Progress"?"selected":""}>In Progress</option>
                    <option ${item.status==="Closed"?"selected":""}>Closed</option>
                </select>

                <select onchange="updatePriority('${item._id}', this.value)"
                    class="border p-1 rounded text-xs w-full">
                    <option ${item.priority==="Hot"?"selected":""}>Hot</option>
                    <option ${item.priority==="Warm"?"selected":""}>Warm</option>
                    <option ${item.priority==="Cold"?"selected":""}>Cold</option>
                </select>

            </div>

            <button onclick="deleteRow('${item._id}')"
                class="mt-3 text-red-500 text-sm">
                Delete
            </button>

        </div>
        `;
    });
}

// =======================
// FILTER
// =======================
function filterTable() {

    const search = document.getElementById("companySearch").value.toLowerCase();

    const filtered = enquiriesData.filter(item =>
        item.companyName.toLowerCase().includes(search) ||
        item.contactPerson.toLowerCase().includes(search)
    );

    renderCards(filtered);
}

// =======================
// ACTIONS
// =======================
async function deleteRow(id) {
    await fetch(`${API_BASE}/client-enquiries/${id}`, { method: "DELETE" });
    loadEnquiries();
}

async function updateStatus(id, status) {
    await fetch(`${API_BASE}/client-enquiries/${id}/status`, {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ status })
    });
}

async function updatePriority(id, priority) {
    await fetch(`${API_BASE}/client-enquiries/${id}/priority`, {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ priority })
    });
}

async function updateFollowUp(id, followUpDate) {
    await fetch(`${API_BASE}/client-enquiries/${id}/followup`, {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ followUpDate })
    });
}

// =======================
// LOGOUT
// =======================
function logout() {
    localStorage.removeItem("clientAuth");
    window.location.href = "index.html";
}

// INIT
loadEnquiries();

</script>

</body>
</html>
