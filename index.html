<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Staffnexa — Client Admin</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="login-wrapper">
  <div class="login-card">
    <h2>Client Admin Login</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <div class="login-buttons">
      <button onclick="login()">Login</button>
      <button class="cancel-btn" onclick="clearLogin()">Cancel</button>
    </div>
    <p id="loginError" class="error"></p>
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" style="display:none;">
  <div class="container">
    <div class="header">
      <h2>Staffnexa — Client Enquiries</h2>
      <div class="right-actions">
        <button class="export-btn" onclick="exportCSV()">Export CSV</button>
        <button class="delete-btn" onclick="deleteSelected()">Delete</button>
      </div>
    </div>

    <div class="filters">
      <input type="text" id="searchInput" placeholder="Search company..." oninput="filterTable()">
      <select id="roleFilter" onchange="filterTable()">
        <option value="">All Roles</option>
      </select>
      <select id="timelineFilter" onchange="filterTable()">
        <option value="">All Timelines</option>
      </select>
    </div>

    <table id="dataTable">
      <thead>
        <tr>
          <th><input type="checkbox" onclick="toggleAll(this)"></th>
          <th>Company</th>
          <th>Contact</th>
          <th>Phone</th>
          <th>Role</th>
          <th>Staff</th>
          <th>Location</th>
          <th>Timeline</th>
          <th>Quotation</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
