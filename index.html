<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Staffnexa — Client Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom right, #1f3c88, #2c5cc5);
        }

        /* LOGIN */
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-card {
            background: #ffffff;
            padding: 40px;
            width: 350px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            text-align: center;
        }

        .login-card img {
            width: 60px;
            margin-bottom: 15px;
        }

        .login-card h2 {
            margin-bottom: 20px;
            color: #1f3c88;
        }

        .login-card input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        .login-card button {
            width: 100%;
            padding: 12px;
            border: none;
            background: #2c5cc5;
            color: white;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
        }

        .login-card button:hover {
            background: #1f3c88;
        }

        /* ADMIN */
        #adminContainer {
            display: none;
            padding: 20px;
            background: #f4f6fa;
            min-height: 100vh;
        }

        header {
            background: #1f3c88;
            color: white;
            padding: 15px;
            font-size: 18px;
        }

        .controls {
            margin: 20px 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .controls input,
        .controls select {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .controls button {
            padding: 8px 12px;
            border: none;
            background: #2c5cc5;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th {
            background: #2c5cc5;
            color: white;
            padding: 10px;
            font-size: 14px;
        }

        td {
            padding: 8px;
            border-bottom: 1px solid #ddd;
            font-size: 13px;
        }

        tr:hover {
            background: #f1f4fb;
        }

        .logout-btn {
            float: right;
            background: #e53935;
        }

        .logout-btn:hover {
            background: #c62828;
        }
    </style>
</head>

<body>

<!-- LOGIN -->
<div id="loginContainer" class="login-wrapper">
    <div class="login-card">
        <img src="logo.png" alt="Staffnexa Logo" />
        <h2>Client Admin Login</h2>
        <input type="text" id="username" placeholder="Username" />
        <input type="password" id="password" placeholder="Password" />
        <button onclick="login()">Login</button>
    </div>
</div>
