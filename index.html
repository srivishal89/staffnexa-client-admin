<!DOCTYPE html>
<html>
<head>
    <title>Client Enquiries - Admin</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .login-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .login-box {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            width: 350px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .login-box h3 {
            margin-bottom: 20px;
        }

        .login-box input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
        }

        .login-box button {
            width: 100%;
            padding: 10px;
            background: #1e4db7;
            color: white;
            border: none;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div id="loginOverlay" class="login-overlay">
    <div class="login-box">
        <h3>Admin Login</h3>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <p id="loginError" style="color:red; display:none;">Invalid credentials</p>
    </div>
</div>

<header class="admin-header">
    <h2>Staffnexa Admin — Client Enquiries</h2>
</header>

<div class="admin-container">
    <!-- your existing table layout remains here -->
</div>

<script>
const ADMIN_USERNAME = "admin";
const ADMIN_PASSWORD = "Staffnexa$5000";

function login() {
    const user = document.getElementById("username").value;
    const pass = document.getElementById("password").value;

    if (user === ADMIN_USERNAME && pass === ADMIN_PASSWORD) {
        document.getElementById("loginOverlay").classList.add("hidden");
    } else {
        document.getElementById("loginError").style.display = "block";
    }
}
</script>

<script src="script.js"></script>

</body>
</html>
