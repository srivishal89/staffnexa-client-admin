<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Staffnexa — Client Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --primary: #1f3c88;
      --primary-light: #2e4fa3;
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --danger: #e53935;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
    }

    /* ===== LOGIN ===== */

    #loginPage {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1f3c88, #2e4fa3);
    }

    .login-card {
      width: 380px;
      background: white;
      padding: 40px;
      border-radius: 14px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
      text-align: center;
    }

    .login-card img {
      width: 70px;
      margin-bottom: 20px;
    }

    .login-card h2 {
      margin-bottom: 25px;
      color: var(--primary);
    }

    .login-card input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 14px;
    }

    .login-actions {
      display: flex;
      gap: 10px;
    }

    .login-actions button {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-secondary {
      background: #e2e8f0;
    }

    /* ===== DASHBOARD ===== */

    #adminPage {
      display: none;
      min-height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 240px;
      background: var(--primary);
      color: white;
      padding: 30px 20px;
    }

    .sidebar h3 {
      margin-bottom: 40px;
      font-weight: 600;
    }

    .sidebar a {
      display: block;
      color: #cbd5e1;
      text-decoration: none;
      margin-bottom: 20px;
      font-size: 15px;
    }

    .sidebar a:hover {
      color: white;
    }

    .main {
      flex: 1;
      padding: 40px;
    }

    .card {
      background: var(--card);
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .filters {
      display: flex;
      gap: 10px;
    }

    .filters input,
    .filters select {
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #ddd;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    .btn-export {
      background: var(--primary);
      color: white;
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-delete {
      background: var(--danger);
      color: white;
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th {
      background: var(--primary);
      color: white;
      padding: 12px;
      text-align: left;
      font-size: 14px;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }

    tr:hover {
      background: #f1f5f9;
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginPage">
  <div class="login-card">
    <img src="logo.png" />
    <h2>Client Admin Login</h2>

    <input type="text" id="username" placeholder="Username" />
    <input type="password" id="password" placeholder="Password" />

    <div class="login-actions">
      <button class="btn-primary" onclick="login()">Login</button>
      <button class="btn-secondary" onclick="cancelLogin()">Cancel</button>
    </div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="adminPage">
  <div class="sidebar">
    <h3>Staffnexa</h3>
    <a href="#">Dashboard</a>
    <a href="#">Client Enquiries</a>
  </div>

  <div class="main">
    <div class="card">
      <div class="card-header">
        <div class="filters">
          <input type="text" placeholder="Search company..." />
          <select>
            <option>All Roles</option>
          </select>
          <select>
            <option>All Timelines</option>
          </select>
        </div>

        <div class="actions">
          <button class="btn-export">Export CSV</button>
          <button class="btn-delete">Delete</button>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th><input type="checkbox" /></th>
            <th>Company</th>
            <th>Contact</th>
            <th>Phone</th>
            <th>Role</th>
            <th>Staff</th>
            <th>Location</th>
            <th>Timeline</th>
            <th>Quotation</th>
          </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
function login() {
  const u = document.getElementById("username").value;
  const p = document.getElementById("password").value;

  if (u === "admin" && p === "Staffnexa$5000") {
    document.getElementById("loginPage").style.display = "none";
    document.getElementById("adminPage").style.display = "flex";
    loadData();
  } else {
    alert("Invalid credentials");
  }
}

function cancelLogin() {
  document.getElementById("username").value = "";
  document.getElementById("password").value = "";
}

async function loadData() {
  try {
    const res = await fetch("https://staffnexa-backend.onrender.com/client-enquiries");
    const data = await res.json();

    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";

    data.data.forEach(item => {
      tbody.innerHTML += `
        <tr>
          <td><input type="checkbox"></td>
          <td>${item.companyName}</td>
          <td>${item.contactPerson}</td>
          <td>${item.phone}</td>
          <td>${item.requirementType}</td>
          <td>${item.numberOfStaff}</td>
          <td>${item.location}</td>
          <td>${item.timeline}</td>
          <td>No</td>
        </tr>
      `;
    });

  } catch (err) {
    alert("Failed to load data");
  }
}
</script>

</body>
</html>
