<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Staffnexa Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root{
  --primary:#1f3c88;
  --primary-light:#2e4fa3;
  --bg:#f4f6fb;
  --card:#ffffff;
  --danger:#e53935;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI",sans-serif;
}

body{background:var(--bg);}

/* LOGIN */
#loginPage{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#1f3c88,#2e4fa3);
}

.login-card{
  width:400px;
  background:white;
  padding:50px 40px;
  border-radius:16px;
  box-shadow:0 20px 50px rgba(0,0,0,0.25);
  text-align:center;
}

.login-card img{
  width:70px;
  margin-bottom:25px;
}

.login-card h2{
  margin-bottom:30px; /* FIXED SPACING */
  color:var(--primary);
}

.login-card input{
  width:100%;
  padding:13px;
  margin-bottom:18px;
  border-radius:8px;
  border:1px solid #ddd;
}

.login-actions{
  display:flex;
  gap:12px;
}

.login-actions button{
  flex:1;
  padding:12px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
}

.btn-primary{background:var(--primary);color:white;}
.btn-secondary{background:#e2e8f0;}

/* DASHBOARD */
#adminPage{
  display:none;
  min-height:100vh;
  display:flex;
}

.sidebar{
  width:240px;
  background:var(--primary);
  color:white;
  padding:30px 20px;
}

.sidebar h3{
  margin-bottom:40px;
}

.sidebar a{
  display:block;
  color:#cbd5e1;
  text-decoration:none;
  margin-bottom:20px;
  cursor:pointer;
}

.sidebar a.active,
.sidebar a:hover{
  color:white;
  font-weight:600;
}

.main{
  flex:1;
  padding:40px;
}

.card{
  background:white;
  padding:25px;
  border-radius:12px;
  box-shadow:0 8px 20px rgba(0,0,0,0.05);
}

.card-header{
  display:flex;
  justify-content:space-between;
  margin-bottom:20px;
}

.filters{
  display:flex;
  gap:10px;
}

.filters input,
.filters select{
  padding:8px;
  border-radius:6px;
  border:1px solid #ddd;
}

.actions{
  display:flex;
  gap:10px;
}

.btn-export{
  background:var(--primary);
  color:white;
  padding:8px 14px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.btn-delete{
  background:var(--danger);
  color:white;
  padding:8px 14px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:var(--primary);
  color:white;
  padding:12px;
  text-align:left;
}

td{
  padding:12px;
  border-bottom:1px solid #eee;
}

tr:hover{background:#f1f5f9;}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">
  <div class="login-card">
    <img src="logo.png">
    <h2>Client Admin Login</h2>

    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">

    <div class="login-actions">
      <button class="btn-primary" onclick="login()">Login</button>
      <button class="btn-secondary" onclick="cancelLogin()">Cancel</button>
    </div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="adminPage">

  <div class="sidebar">
    <h3>Staffnexa</h3>
    <a id="menuClient" class="active" onclick="loadClient()">Client Enquiries</a>
    <a id="menuCandidate" onclick="loadCandidates()">Job Applications</a>
  </div>

  <div class="main">
    <div class="card">

      <div class="card-header">
        <div class="filters">
          <input type="text" id="searchInput" placeholder="Search..." oninput="applyFilters()">
        </div>

        <div class="actions">
          <button class="btn-export" onclick="exportCSV()">Export CSV</button>
          <button class="btn-delete" onclick="deleteSelected()">Delete</button>
        </div>
      </div>

      <table>
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>

    </div>
  </div>
</div>

<script>
let allData=[];
let currentView="client";

/* LOGIN */
function login(){
  if(username.value==="admin" && password.value==="Staffnexa$5000"){
    loginPage.style.display="none";
    adminPage.style.display="flex";
    loadClient();
  }else alert("Invalid credentials");
}

function cancelLogin(){
  username.value="";
  password.value="";
}

/* LOAD CLIENT */
async function loadClient(){
  currentView="client";
  menuClient.classList.add("active");
  menuCandidate.classList.remove("active");

  const res=await fetch("https://staffnexa-backend.onrender.com/client-enquiries");
  const data=await res.json();
  allData=data.data;

  tableHead.innerHTML=`
    <tr>
      <th><input type="checkbox" id="selectAll" onclick="toggleSelectAll()"></th>
      <th>Company</th>
      <th>Contact</th>
      <th>Phone</th>
      <th>Role</th>
      <th>Staff</th>
      <th>Location</th>
      <th>Timeline</th>
    </tr>
  `;
  renderClient();
}

/* LOAD CANDIDATES */
async function loadCandidates(){
  currentView="candidate";
  menuCandidate.classList.add("active");
  menuClient.classList.remove("active");

  const res=await fetch("https://staffnexa-backend.onrender.com/candidates");
  const data=await res.json();
  allData=data.data;

  tableHead.innerHTML=`
    <tr>
      <th><input type="checkbox" id="selectAll" onclick="toggleSelectAll()"></th>
      <th>Name</th>
      <th>Phone</th>
      <th>Role</th>
      <th>Location</th>
      <th>Date</th>
    </tr>
  `;
  renderCandidates();
}

function renderClient(){
  tableBody.innerHTML="";
  allData.forEach(i=>{
    tableBody.innerHTML+=`
      <tr>
        <td><input type="checkbox" class="rowCheck" data-id="${i._id}"></td>
        <td>${i.companyName}</td>
        <td>${i.contactPerson}</td>
        <td>${i.phone}</td>
        <td>${i.requirementType}</td>
        <td>${i.numberOfStaff}</td>
        <td>${i.location}</td>
        <td>${i.timeline}</td>
      </tr>
    `;
  });
}

function renderCandidates(){
  tableBody.innerHTML="";
  allData.forEach(i=>{
    tableBody.innerHTML+=`
      <tr>
        <td><input type="checkbox" class="rowCheck" data-id="${i._id}"></td>
        <td>${i.name}</td>
        <td>${i.phone}</td>
        <td>${i.role}</td>
        <td>${i.location}</td>
        <td>${new Date(i.createdAt).toLocaleString()}</td>
      </tr>
    `;
  });
}

function toggleSelectAll(){
  document.querySelectorAll(".rowCheck")
    .forEach(cb=>cb.checked=selectAll.checked);
}

function getSelectedIds(){
  return [...document.querySelectorAll(".rowCheck:checked")]
    .map(cb=>cb.dataset.id);
}

async function deleteSelected(){
  const ids=getSelectedIds();
  if(ids.length===0)return alert("No selection");

  const endpoint=currentView==="client"
    ? "client-enquiries"
    : "candidates";

  for(const id of ids){
    await fetch(`https://staffnexa-backend.onrender.com/${endpoint}/${id}`,{
      method:"DELETE"
    });
  }

  currentView==="client"?loadClient():loadCandidates();
}

function exportCSV(){
  let csv="";
  allData.forEach(i=>{
    csv+=Object.values(i).join(",")+"\n";
  });

  const blob=new Blob([csv],{type:"text/csv"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="data.csv";
  a.click();
}
</script>

</body>
</html>
