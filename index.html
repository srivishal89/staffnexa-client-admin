<!DOCTYPE html>
<html>
<head>
  <title>Staffnexa — Client Enquiries</title>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="container">
  <h1>Staffnexa — Client Enquiries</h1>

  <div class="controls">
    <input type="text" id="searchInput" placeholder="Search company..." />
    
    <select id="roleFilter">
      <option value="">All Roles</option>
    </select>

    <select id="timelineFilter">
      <option value="">All Timelines</option>
    </select>

    <button onclick="exportCSV()" class="export-btn">Export CSV</button>
    <button onclick="logout()" class="delete-btn">Logout</button>
  </div>

  <table id="dataTable">
    <thead>
      <tr>
        <th>Company</th>
        <th>Contact</th>
        <th>Phone</th>
        <th>Role</th>
        <th>Staff</th>
        <th>Location</th>
        <th>Timeline</th>
        <th>Quotation</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script src="script.js"></script>
</body>
</html>
