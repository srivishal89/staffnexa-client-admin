<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Staffnexa — Client Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom right, #1f3c88, #2c5cc5);
        }

        /* LOGIN */
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-card {
            background: #ffffff;
            padding: 40px;
            width: 350px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            text-align: center;
        }

        .login-card img {
            width: 60px;
            margin-bottom: 15px;
        }

        .login-card h2 {
            margin-bottom: 20px;
            color: #1f3c88;
        }

        .login-card input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        .login-card button {
            width: 100%;
            padding: 12px;
            border: none;
            background: #2c5cc5;
            color: white;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
        }

        .login-card button:hover {
            background: #1f3c88;
        }

        /* ADMIN */
        #adminContainer {
            display: none;
            padding: 20px;
            background: #f4f6fa;
            min-height: 100vh;
        }

        header {
            background: #1f3c88;
            color: white;
            padding: 15px;
            font-size: 18px;
        }

        .controls {
            margin: 20px 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .controls input,
        .controls select {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .controls button {
            padding: 8px 12px;
            border: none;
            background: #2c5cc5;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th {
            background: #2c5cc5;
            color: white;
            padding: 10px;
            font-size: 14px;
        }

        td {
            padding: 8px;
            border-bottom: 1px solid #ddd;
            font-size: 13px;
        }

        tr:hover {
            background: #f1f4fb;
        }

        .logout-btn {
            float: right;
            background: #e53935;
        }

        .logout-btn:hover {
            background: #c62828;
        }
    </style>
</head>

<body>

<!-- LOGIN -->
<div id="loginContainer" class="login-wrapper">
    <div class="login-card">
        <img src="logo.png" alt="Staffnexa Logo" />
        <h2>Client Admin Login</h2>
        <input type="text" id="username" placeholder="Username" />
        <input type="password" id="password" placeholder="Password" />
        <button onclick="login()">Login</button>
    </div>
</div>

<!-- ADMIN PANEL -->
<div id="adminContainer">
    <header>
        Staffnexa Admin — Client Enquiries
        <button class="logout-btn" onclick="logout()">Logout</button>
    </header>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="Search Company" onkeyup="filterTable()" />

        <select id="roleFilter" onchange="filterTable()">
            <option value="">All Roles</option>
            <option>Housekeeping</option>
            <option>Pantry</option>
            <option>Supervisor</option>
            <option>Telecaller</option>
        </select>

        <select id="timelineFilter" onchange="filterTable()">
            <option value="">All Timelines</option>
            <option>Immediate</option>
            <option>Within 7 Days</option>
            <option>Within 15 Days</option>
            <option>Within 30 Days</option>
        </select>

        <button onclick="exportCSV()">Export CSV</button>
    </div>

    <table id="dataTable">
        <thead>
            <tr>
                <th>Company</th>
                <th>Contact</th>
                <th>Phone</th>
                <th>Role</th>
                <th>Staff</th>
                <th>Location</th>
                <th>Timeline</th>
                <th>Quotation</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
    const API_URL = "https://staffnexa-backend.onrender.com/client-enquiries";

    function login() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        if (username === "admin" && password === "Staffnexa$5000") {
            document.getElementById("loginContainer").style.display = "none";
            document.getElementById("adminContainer").style.display = "block";
            loadData();
        } else {
            alert("Invalid credentials");
        }
    }

    function logout() {
        document.getElementById("adminContainer").style.display = "none";
        document.getElementById("loginContainer").style.display = "flex";
    }

    async function loadData() {
        try {
            const res = await fetch(API_URL);
            const data = await res.json();

            const tbody = document.querySelector("#dataTable tbody");
            tbody.innerHTML = "";

            data.data.forEach(item => {
                const row = `
                    <tr>
                        <td>${item.companyName}</td>
                        <td>${item.contactPerson}</td>
                        <td>${item.phone}</td>
                        <td>${item.requirementType}</td>
                        <td>${item.numberOfStaff}</td>
                        <td>${item.location}</td>
                        <td>${item.timeline}</td>
                        <td>
                            <select>
                                <option>No</option>
                                <option>Yes</option>
                            </select>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });

        } catch (err) {
            alert("Failed to load data");
        }
    }

    function filterTable() {
        const search = document.getElementById("searchInput").value.toLowerCase();
        const role = document.getElementById("roleFilter").value;
        const timeline = document.getElementById("timelineFilter").value;

        const rows = document.querySelectorAll("#dataTable tbody tr");

        rows.forEach(row => {
            const company = row.cells[0].textContent.toLowerCase();
            const roleText = row.cells[3].textContent;
            const timelineText = row.cells[6].textContent;

            if (
                company.includes(search) &&
                (role === "" || roleText === role) &&
                (timeline === "" || timelineText === timeline)
            ) {
                row.style.display = "";
            } else {
                row.style.display = "none";
            }
        });
    }

    function exportCSV() {
        let csv = [];
        const rows = document.querySelectorAll("table tr");

        rows.forEach(row => {
            const cols = row.querySelectorAll("td, th");
            const rowData = [];
            cols.forEach(col => rowData.push(col.innerText));
            csv.push(rowData.join(","));
        });

        const blob = new Blob([csv.join("\n")], { type: "text/csv" });
        const url = window.URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.setAttribute("hidden", "");
        a.setAttribute("href", url);
        a.setAttribute("download", "client-enquiries.csv");
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }
</script>

</body>
</html>
