<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Staffnexa — Client Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#1f3c88,#325aa8);
}

/* LOGIN */

.login-container{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.login-card{
  background:white;
  width:380px;
  padding:40px;
  border-radius:14px;
  box-shadow:0 20px 50px rgba(0,0,0,0.3);
  text-align:center;
}

.login-card img{
  width:80px;
  margin-bottom:15px;
}

.login-card h2{
  margin-bottom:25px;
}

.login-card input{
  width:100%;
  padding:13px;
  margin-bottom:18px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:14px;
}

.button-row{
  display:flex;
  gap:10px;
}

.button-row button{
  flex:1;
  padding:12px;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.btn-login{
  background:#325aa8;
  color:white;
}

.btn-cancel{
  background:#ddd;
}

/* DASHBOARD */

.dashboard{
  display:none;
  padding:40px;
}

.card{
  background:white;
  padding:30px;
  border-radius:14px;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.top-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.actions{
  display:flex;
  gap:10px;
}

.actions button{
  padding:10px 16px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
}

.btn-export{
  background:#325aa8;
  color:white;
}

.btn-delete{
  background:#b22222;
  color:white;
}

table{
  width:100%;
  border-collapse:collapse;
}

thead{
  background:#325aa8;
  color:white;
}

th,td{
  padding:12px;
  border-bottom:1px solid #eee;
  font-size:14px;
}

tr:hover{
  background:#f5f7fb;
}

</style>
</head>
<body>

<div class="login-container" id="loginBox">
  <div class="login-card">
    <img src="logo.png">
    <h2>Client Admin Login</h2>

    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">

    <div class="button-row">
      <button class="btn-login" onclick="login()">Login</button>
      <button class="btn-cancel" onclick="clearFields()">Cancel</button>
    </div>
  </div>
</div>

<div class="dashboard" id="dashboard">
  <div class="card">
    <div class="top-row">
      <h2>Staffnexa — Client Enquiries</h2>
      <div class="actions">
        <button class="btn-export" onclick="exportCSV()">Export CSV</button>
        <button class="btn-delete" onclick="deleteSelected()">Delete</button>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th><input type="checkbox" onclick="toggleAll(this)"></th>
          <th>Company</th>
          <th>Contact</th>
          <th>Phone</th>
          <th>Role</th>
          <th>Staff</th>
          <th>Location</th>
          <th>Timeline</th>
          <th>Quotation</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script>

const API_URL = "https://staffnexa-backend.onrender.com/client-enquiries";

function login(){
  const u=document.getElementById("username").value;
  const p=document.getElementById("password").value;

  if(u==="admin" && p==="Staffnexa$5000"){
    document.getElementById("loginBox").style.display="none";
    document.getElementById("dashboard").style.display="block";
    loadData();
  }else{
    alert("Invalid credentials");
  }
}

function clearFields(){
  document.getElementById("username").value="";
  document.getElementById("password").value="";
}

async function loadData(){
  try{
    const res=await fetch(API_URL);
    const data=await res.json();

    const tbody=document.getElementById("tableBody");
    tbody.innerHTML="";

    data.data.forEach(item=>{
      tbody.innerHTML+=`
        <tr>
          <td><input type="checkbox" value="${item._id}"></td>
          <td>${item.companyName}</td>
          <td>${item.contactPerson}</td>
          <td>${item.phone}</td>
          <td>${item.requirementType}</td>
          <td>${item.numberOfStaff}</td>
          <td>${item.location}</td>
          <td>${item.timeline}</td>
          <td>${item.quotation || "No"}</td>
        </tr>
      `;
    });

  }catch(err){
    alert("Failed to load data");
  }
}

function toggleAll(source){
  document.querySelectorAll("#tableBody input[type=checkbox]")
    .forEach(cb=>cb.checked=source.checked);
}

function deleteSelected(){
  alert("Delete API to be connected next.");
}

function exportCSV(){
  alert("Export feature coming next.");
}

</script>

</body>
</html>
